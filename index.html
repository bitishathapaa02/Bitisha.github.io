<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BITISHAA — Frontend Developer & Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#f6f6f4;--ink:#1d2a1f;--muted:#5d6652;--green:#386641;--red:#bc4749;--line:#1d2a1f26;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:14px}
h2{font-size:clamp(40px,7vw,76px);font-weight:800;margin-bottom:48px;letter-spacing:-.02em}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font:800 22px Fraunces,serif;text-decoration:none}
.links{display:flex;gap:6px;overflow-x:auto}
.links a{text-decoration:none;font-size:15px;font-weight:500;padding:8px 14px;border-radius:99px;white-space:nowrap;transition:.2s}
.links a:hover{background:var(--ink);color:var(--bg)}
.links a.cta{background:var(--green);color:#fff}
/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:120px 0 60px;position:relative}
.num{position:absolute;right:-10px;top:90px;font:800 clamp(220px,38vw,520px)/.8 Fraunces,serif;color:var(--green);opacity:.12;pointer-events:none;user-select:none}
.badge{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:99px;font-size:14px;margin-bottom:28px}
.dot{width:9px;height:9px;border-radius:50%;background:#2fb344;box-shadow:0 0 0 0 #2fb344;animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px #2fb34400}100%{box-shadow:0 0 0 0 #2fb34400}}
.hero h1{font-size:clamp(56px,13vw,170px);font-weight:800;letter-spacing:-.04em}
.hero h1 em{color:var(--red);font-style:italic;font-weight:600}
.hero p{max-width:540px;font-size:20px;color:var(--muted);margin:28px 0 36px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:15px 28px;border-radius:99px;font-weight:700;text-decoration:none;border:2px solid var(--ink);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-3px)}
.btn.fill{background:var(--ink);color:var(--bg)}
/* ticker */
.ticker{background:var(--green);color:#fff;overflow:hidden;white-space:nowrap;padding:14px 0;transform:rotate(-1deg);margin:0 -10px}
.ticker div{display:inline-block;animation:t 30s linear infinite;font-weight:700;letter-spacing:.06em}
.ticker span{margin:0 28px}
@keyframes t{to{transform:translateX(-50%)}}
/* squad */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 24px 50px -20px #0005}
.card .no{position:absolute;right:18px;top:8px;font:800 90px Fraunces,serif;color:var(--green);opacity:.14}
.pos{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;background:var(--red);color:#fff;padding:4px 10px;border-radius:6px;margin-bottom:60px}
.card h3{font-size:30px;margin-bottom:10px}
.card p{color:var(--muted);font-size:15px;margin-bottom:20px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats span{font-size:12px;border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.card a.go{display:inline-block;margin-top:20px;font-weight:700;text-decoration:none;color:var(--green)}
/* incoming */
.row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:24px;align-items:center;padding:26px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row h3{font-size:28px}
.row small{color:var(--muted);display:block;font-size:14px;margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.tag{font-size:13px;font-weight:700;color:var(--red);white-space:nowrap}
/* setlist */
.track{display:grid;grid-template-columns:48px 1fr auto;gap:18px;align-items:center;padding:18px 20px;border-radius:16px;transition:.2s;cursor:default}
.track:hover{background:var(--surface);padding-left:30px}
.track b{font:600 20px Fraunces,serif;color:var(--red)}
.track strong{font-size:20px}
.track em{font-style:normal;color:var(--muted);font-size:14px}
/* offer */
.offer{background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(28px,6vw,64px)}
.offer h2{margin-bottom:12px}
.offer>p{opacity:.75;margin-bottom:32px;max-width:520px}
form{display:grid;gap:16px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;display:grid;gap:8px}
input,select,textarea{font:inherit;font-size:16px;background:#ffffff14;border:1px solid #ffffff33;color:inherit;padding:14px 16px;border-radius:14px;width:100%}
select option{color:#111}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red)}
form button{border:0;background:var(--red);color:#fff;font:700 17px inherit;padding:16px 30px;border-radius:99px;cursor:pointer;justify-self:start;transition:transform .2s}
form button:hover{transform:scale(1.05)}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
.rv{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:700px){.row{grid-template-columns:1fr}.links a:not(.cta){display:none}form{grid-template-columns:1fr}.track{grid-template-columns:36px 1fr}.track em{grid-column:2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.hero{min-height:100svh;padding:90px 0 40px;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;text-align:center}
.big{position:absolute;top:50%;left:50%;transform:translate(-50%,-62%);font:800 clamp(70px,19vw,260px)/1 Fraunces,serif;letter-spacing:-.04em;color:var(--green);opacity:.9;white-space:nowrap;z-index:0}
.photo{position:relative;z-index:1;width:min(78vw,430px);aspect-ratio:4/5;border-radius:200px 200px 28px 28px;overflow:hidden;box-shadow:0 40px 80px -30px #000a;margin-bottom:-60px;transition:transform .5s}
.photo:hover{transform:scale(1.03) rotate(-1deg)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.hero-bottom{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;max-width:560px;padding:26px 24px;margin:0 24px}
.hero-bottom p{margin:14px 0 20px;font-size:18px}
.hero-bottom .badge{margin-bottom:0}
.btns{justify-content:center}
.logo{letter-spacing:.04em}
</style>
</head>
<body>
<nav><div class="wrap">
<a class="logo" href="#home">BITISHAA</a>
<div class="links"><a href="#incoming">Incoming</a><a href="#setlist">Setlist</a><a class="cta" href="#contact">Make an offer</a></div>
</div></nav>

<header class="hero" id="home">
<h1 class="big" aria-hidden="true">BITISHAA</h1>
<figure class="photo"><img alt="BITISHAA" src="photo.jpeg"></figure>
<div class="wrap hero-bottom">
<div class="badge"><span class="dot"></span>Transfer window open — available for new projects</div>
<p>Frontend developer and UI/UX designer building fast, considered interfaces.</p>
<div class="btns"><a class="btn fill" href="#incoming">Incoming</a><a class="btn" href="#contact">Make an offer</a></div>
</div></header>

</body>
</html>
